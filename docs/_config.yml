remote_theme: Pat-79/jekyll-awayfromhome
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-redirect-from

# ── Brand ──────────────────────────────────────────────────────────────────────
brand:
  title: awayfromhome.nl
  logo: /assets/images/globe_filled_bl_blue_green.svg_round.svg


navigation:
  - title: Home
    key: home
    url: /en/
    url_nl: /nl/
    url_en: /en/
  - title: About
    key: about
    url: /en/about/
    url_nl: /nl/about/
    url_en: /en/about/
  - title: Blogs
    key: blog
    url: /en/blog/
    url_nl: /nl/blog/
    url_en: /en/blog/
  - title: Browse
    key: browse
    url: /en/browse/
    url_nl: /nl/browse/
    url_en: /en/browse/
  - title: Social Media
    key: social-media
    url: /en/social-media/
    url_nl: /nl/social-media/
    url_en: /en/social-media/
  - title: Search
    key: search
    url: /en/search/
    url_nl: /nl/search/
    url_en: /en/search/
  - title: Cookies
    key: cookies
    url: /en/cookies/
    url_nl: /nl/cookies/
    url_en: /en/cookies/
  - title: Sitemap
    key: page-sitemap
    url: /en/sitemap/
    url_nl: /nl/sitemap/
    url_en: /en/sitemap/
