# ── Site identity ──────────────────────────────────────────────────────────────
title: awayfromhome.nl
description: your getaway at home
permalink: /en/blog/:year-:month-:day_:title/
email: noreply@awayfromhome.nl
lang: en
timezone: "Europe/Amsterdam"


